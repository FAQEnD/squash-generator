<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, maximum-scale=1" />
        <title>Match Generator</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <h1><a href="index.html">Генератор матчів</a></h1>
        </header>
        <main>
            <h2 id="playersTitle">Гравці</h2>
            <div class="players-grid" id="players"></div>

            <h2 id="settingsTitle">Параметри</h2>
            <div class="controls">
                <label>Кількість ігор <input id="games" type="number" min="1" value="8" /></label>
                <label
                    >Кількість кортів <input id="courts" type="number" min="1" value="2"
                /></label>
                <label
                    >Номери кортів <input id="courtLabels" type="text" placeholder="1, 2, 3"
                /></label>
                <label
                    >Початок ігрової сесії <input id="startTime" type="time" value="18:40"
                /></label>
                <label
                    >Вартість оренди <input id="rentalCost" type="number" min="0" step="1"
                /></label>
                <label
                    >Оплата <input id="paymentTarget" type="text" placeholder="Картка або Monobank"
                /></label>

                <label class="seed-label">
                    Seed
                    <input id="seed" type="text" />
                    <button id="refreshSeed" type="button" title="Оновити seed">↻</button>
                </label>
            </div>

            <div class="row">
                <button id="generateBtn">Згенерувати</button>
            </div>

            <div class="row hidden" id="afterGenRow">
                <div class="export-row">
                    <button class="export-btn" id="exportCsvBtn">Експорт CSV</button>
                    <button class="export-btn" id="exportPdfBtn">Експорт PDF</button>
                </div>
                <button class="share-btn" id="shareBtn">Поділитися</button>
            </div>

            <section
                id="playerScheduleBox"
                class="shared-section player-schedule readonly-hidden"
                aria-live="polite"
            >
                <button
                    id="playerScheduleToggle"
                    class="shared-section-toggle"
                    type="button"
                    aria-expanded="true"
                    aria-controls="playerScheduleContent"
                >
                    Мої ігри
                </button>
                <div id="playerScheduleContent" class="shared-section-content">
                    <div class="player-schedule-controls">
                        <label for="playerScheduleSelect">Гравець</label>
                        <select id="playerScheduleSelect"></select>
                        <button id="showPlayerScheduleBtn" type="button">
                            Показати мій розклад
                        </button>
                        <button id="showPaymentBtn" class="payment-jump-btn" type="button">
                            Скільки сплатити?
                        </button>
                    </div>
                    <div id="playerScheduleResult" class="player-schedule-result"></div>
                </div>
            </section>

            <section id="resultsSection" class="shared-section results-section">
                <button
                    id="resultsToggle"
                    class="shared-section-toggle"
                    type="button"
                    aria-expanded="true"
                    aria-controls="resultsContent"
                >
                    Результат
                </button>
                <div id="resultsContent" class="shared-section-content">
                    <h2 id="resultsTitle">Результат</h2>
                    <div id="tableBox"></div>
                </div>
            </section>

            <section id="paymentSection" class="shared-section payment-section readonly-hidden">
                <button
                    id="paymentToggle"
                    class="shared-section-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="paymentContent"
                >
                    Оплата
                </button>
                <div id="paymentContent" class="shared-section-content" hidden>
                    <div
                        id="paymentBox"
                        class="payment-box readonly-hidden"
                        aria-live="polite"
                    ></div>
                </div>
            </section>

            <h2 id="statsTitle">Статистика</h2>
            <div id="statsBox" class="stats-box">
                <div id="statsPlayers"></div>
                <div id="statsPairs" class="stats-pairs"></div>
            </div>
        </main>
        <script src="src/config.js"></script>
        <script src="src/generator.js"></script>
        <script src="src/time.js"></script>
        <script src="src/share-state.js"></script>
        <script src="src/ui.js"></script>
        <script src="script.js"></script>
    </body>
</html>
